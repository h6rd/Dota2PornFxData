name: VPK Inspector

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: vpk-inspector-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  VRF_VERSION: latest
  VRF_REPO: ValveResourceFormat/ValveResourceFormat
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"

jobs:
  inspect-vpk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.head_ref, 'submission/')

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Source2Viewer-CLI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=""
          if [ "$VRF_VERSION" != "latest" ]; then TAG="$VRF_VERSION"; fi

          # Find the Linux x64 CLI asset (exact name first, then a tolerant match in case it gets renamed).
          ASSETS=$(gh release view $TAG --repo "$VRF_REPO" --json assets --jq '.assets[].name')
          ASSET=$(grep -ixE 'cli-linux-x64\.zip' <<< "$ASSETS" | head -n 1 || true)
          if [ -z "$ASSET" ]; then
            ASSET=$(grep -iE 'cli.*linux.*(x64|amd64).*\.zip' <<< "$ASSETS" | head -n 1 || true)
          fi
          if [ -z "$ASSET" ]; then
            echo "::error::No Linux x64 CLI asset found in the $VRF_REPO release ($VRF_VERSION). Assets:"
            echo "$ASSETS"
            exit 1
          fi
          echo "Downloading $ASSET ($VRF_VERSION)"
          mkdir -p s2v/bin
          gh release download $TAG --repo "$VRF_REPO" --pattern "$ASSET" --dir s2v
          unzip -q "s2v/$ASSET" -d s2v/bin

          BIN=$(find s2v/bin -type f -iname 'Source2Viewer-CLI' | head -n 1 || true)
          if [ -z "$BIN" ]; then
            echo "::error::Source2Viewer-CLI binary not found in the downloaded archive"
            find s2v/bin -type f | head -n 50
            exit 1
          fi
          chmod +x "$BIN"
          echo "S2V_CLI=$PWD/$BIN" >> "$GITHUB_ENV"
          "$BIN" --version || true

      - name: Find and inspect VPK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p inspector-work
          ZIP_FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[] | select(.status != "removed") | .filename' \
            | grep -iE '^pending/[^/]+/[^/]+\.zip$' \
            | awk '{ print length($0) "\t" $0 }' | sort -n | cut -f2- | head -n 4 || true)
          if [ -z "$ZIP_FILES" ]; then
            echo "No ZIP file added by this PR found in pending/"
            exit 1
          fi
          while IFS= read -r z; do
            if [ ! -f "$z" ]; then
              echo "Missing ZIP in checkout: $z"
              exit 1
            fi
          done <<< "$ZIP_FILES"
          echo "Found ZIP files:"
          echo "$ZIP_FILES"
          export ZIP_FILES
          python <<'PY'
          import os
          import re
          import subprocess
          import sys
          import zipfile

          CLI = os.environ["S2V_CLI"]
          MAX_VPK_BYTES = 100 * 1024 * 1024
          MAX_LIST_LINES = 200
          MAX_COMMENT_CHARS = 55000
          CLI_TIMEOUT_SECONDS = 300
          CLI_OUTPUT_LINES = 30
          VPK_SIGNATURE = b"\x34\x12\xaa\x55"  # 0x55AA1234, little endian

          # "--vpk_dir" prints one line per file: "<path> crc=0x.. metadatasz=.. fnumber=.. ofs=0x.. sz=<bytes>"
          DIR_LINE_RE = re.compile(
              r"^(?P<path>.+?)\s+crc=0x[0-9a-fA-F]+\s+metadatasz=\d+\s+fnumber=\d+\s+ofs=0x[0-9a-fA-F]+\s+sz=(?P<size>\d+)\s*$"
          )
          # Fallback for a plain path-per-line listing ("--vpk_list").
          PLAIN_LINE_RE = re.compile(r"^[\w\-./ ()\[\]+@#,!']+\.[A-Za-z0-9_]+$")


          def clean(value):
              # Names come from an untrusted archive: keep them printable and unable to break out of a Markdown fence.
              return "".join(ch for ch in str(value) if ch.isprintable() and ch not in "`~")


          def human(n):
              if n >= 1024 * 1024:
                  return f"{n / 1024 / 1024:.1f} MB"
              return f"{max(1, round(n / 1024))} KB" if n else "0 KB"


          def build_tree(paths, include_files):
              tree = {}
              for path in paths:
                  parts = path.replace("\\", "/").split("/")
                  if not include_files:
                      parts = parts[:-1]
                  current = tree
                  for part in parts:
                      current = current.setdefault(part, {})
              return tree


          def render_tree(node, prefix=""):
              lines = []
              items = sorted(node.items())
              for index, (name, children) in enumerate(items):
                  last = index == len(items) - 1
                  connector = "└── " if last else "├── "
                  lines.append(prefix + connector + name)
                  if children:
                      next_prefix = prefix + ("    " if last else "│   ")
                      lines.extend(render_tree(children, next_prefix))
              return lines


          def parse_listing(text):
              """Returns [(path, size_or_None), ...] from Source2Viewer-CLI output."""
              lines = [l.rstrip("\r") for l in text.splitlines()]
              entries = []
              for line in lines:
                  m = DIR_LINE_RE.match(line)
                  if m:
                      entries.append((clean(m.group("path")), int(m.group("size"))))
              if entries:
                  return entries
              for line in lines:
                  s = line.strip()
                  if s and not s.startswith(("-", "=", "[", "#")) and ": " not in s and PLAIN_LINE_RE.match(s):
                      entries.append((clean(s), None))
              return entries


          def excerpt(text, limit=CLI_OUTPUT_LINES):
              lines = [clean(l) for l in text.splitlines() if l.strip()]
              if len(lines) > limit:
                  lines = lines[:limit] + [f"... ({len(lines) - limit} more lines)"]
              return "\n".join(lines) or "(no output)"


          def first_error(text):
              for line in text.splitlines():
                  s = line.strip()
                  if s and re.search(r"exception|error|invalid|fail|corrupt|unexpected|unable|could not", s, re.I):
                      return clean(s)[:300]
              return None


          def inspect(zip_file, index):
              with zipfile.ZipFile(zip_file) as zf:
                  file_infos = [i for i in zf.infolist() if not i.is_dir()]
                  unexpected = [i.filename for i in file_infos if not i.filename.lower().endswith(".vpk")]
                  if unexpected or len(file_infos) != 1:
                      listing = "\n".join(clean(i.filename) for i in file_infos[:MAX_LIST_LINES]) or "(no files)"
                      return False, [
                          "⚠️ **Rejected: the mod archive must contain exactly one `.vpk` file and nothing else.**",
                          "",
                          "~~~~~text",
                          listing,
                          "~~~~~",
                      ]

                  # Extract only the single .vpk, with a size cap (never trust declared sizes of an untrusted archive)
                  info = file_infos[0]
                  base = re.sub(r"[^A-Za-z0-9._-]", "_", os.path.basename(info.filename)) or "mod_dir.vpk"
                  out_dir = os.path.join("inspector-work", "extracted", str(index))
                  os.makedirs(out_dir, exist_ok=True)
                  vpk_file = os.path.join(out_dir, base)
                  written = 0
                  with zf.open(info) as src, open(vpk_file, "wb") as dst:
                      while True:
                          chunk = src.read(1024 * 1024)
                          if not chunk:
                              break
                          written += len(chunk)
                          if written > MAX_VPK_BYTES:
                              return False, [f"⚠️ **Rejected: the `.vpk` inside the archive is larger than the inspector limit.**"]
                          dst.write(chunk)

              print(f"Found VPK: {vpk_file} ({written} bytes)")
              vpk_name = clean(os.path.basename(info.filename))

              def corrupt(reason, details=None, parser_error=None):
                  print(f"::error::Invalid VPK in {zip_file}: {reason}")
                  lines = [
                      "⚠️ **Rejected: the `.vpk` file is corrupted or is not a valid VPK archive.**",
                      "",
                      f"- **File:** `{vpk_name}`",
                      f"- **Size:** {written} bytes",
                      f"- **Problem:** {reason}",
                  ]
                  if parser_error:
                      lines.append(f"- **Source2Viewer-CLI:** `{parser_error}`")
                  if details:
                      lines += ["", "<details><summary>Source2Viewer-CLI output</summary>", "", "~~~~~text", details, "~~~~~", "", "</details>"]
                  lines += [
                      "",
                      "The VPK could not be read by Source2Viewer-CLI. Please re-pack the mod (e.g. with PreMod), "
                      "check that the file was not damaged or edited, and resubmit.",
                  ]
                  return False, lines

              with open(vpk_file, "rb") as fh:
                  if fh.read(4) != VPK_SIGNATURE:
                      return corrupt("the file does not start with a VPK signature (wrong file type)")

              try:
                  proc = subprocess.run(
                      [CLI, "-i", vpk_file, "--vpk_dir"],
                      capture_output=True, timeout=CLI_TIMEOUT_SECONDS,
                  )
              except subprocess.TimeoutExpired:
                  return corrupt(f"reading the VPK took longer than {CLI_TIMEOUT_SECONDS} seconds")

              stdout = proc.stdout.decode("utf-8", errors="replace")
              stderr = proc.stderr.decode("utf-8", errors="replace")
              combined = (stdout + "\n" + stderr).strip()
              entries = parse_listing(stdout)
              print(f"Source2Viewer-CLI exit code {proc.returncode}, {len(entries)} files parsed")

              if proc.returncode != 0 and not entries:
                  return corrupt(f"Source2Viewer-CLI exited with code {proc.returncode}", excerpt(combined), first_error(combined))
              if not entries:
                  err = first_error(combined)
                  if err:
                      return corrupt("the VPK directory index could not be read", excerpt(combined), err)
                  # No error reported, but nothing recognisable in the output: do not blame the mod author.
                  print("::error::Could not parse the Source2Viewer-CLI output (inspector problem or empty VPK)")
                  return False, [
                      "⚠️ **The inspector could not list the files of this `.vpk`** (empty archive, or the Source2Viewer-CLI output format changed).",
                      "",
                      f"- **File:** `{vpk_name}`",
                      f"- **Size:** {written} bytes",
                      "",
                      "<details><summary>Source2Viewer-CLI output</summary>", "", "~~~~~text", excerpt(combined), "~~~~~", "", "</details>",
                  ]

              return True, sorted(set(entries))


          def render_archive(title, entries, include_files):
              paths = [p for p, _ in entries]
              extensions = {}
              for path, size in entries:
                  filename = os.path.basename(path)
                  ext = "." + filename.rsplit(".", 1)[1].lower() if "." in filename else "[no extension]"
                  count, total = extensions.get(ext, (0, 0))
                  extensions[ext] = (count + 1, total + (size or 0))
              have_sizes = all(size is not None for _, size in entries)

              heading = "####" if title else "###"
              tree_text = "\n".join(render_tree(build_tree(paths, include_files)))
              ext_lines = [
                  f"- `{ext}`: {count}" + (f" ({human(total)})" if have_sizes else "")
                  for ext, (count, total) in sorted(extensions.items(), key=lambda x: (-x[1][0], x[0]))
              ]
              lines = []
              if title:
                  lines += [f"### {title}", ""]
              lines += [f"{heading} Directory structure", "", "```text", tree_text, "```", ""]
              lines += [f"{heading} Extensions", ""] + ext_lines + ["", f"**Total files:** {len(entries)}"
                        + (f" · **Content size:** {human(sum(s for _, s in entries))}" if have_sizes else ""), ""]
              return lines


          zip_files = [z.strip() for z in os.environ["ZIP_FILES"].splitlines() if z.strip()]
          results = []
          for index, zip_file in enumerate(zip_files, 1):
              name = clean(os.path.basename(zip_file))
              try:
                  ok, payload = inspect(zip_file, index)
              except zipfile.BadZipFile as exc:
                  ok, payload = False, [f"⚠️ **Rejected: this is not a valid ZIP archive** (`{clean(exc)}`)."]
              results.append((name, ok, payload))


          def render_report(include_files):
              multi = len(results) > 1
              lines = ["<!-- vpk-inspector-report -->", "## VPK Inspector", ""]
              if multi:
                  lines += [f"Inspected **{len(results)}** mod archives (a mod with styles).", ""]
              for index, (name, ok, payload) in enumerate(results, 1):
                  title = f"{index}. `{name}`" if multi else ""
                  if ok:
                      lines += render_archive(title, payload, include_files)
                  else:
                      lines += ([f"### {title}", ""] if multi else []) + payload + [""]
              if not include_files:
                  lines += ["> Individual files are hidden because the full tree exceeds the GitHub comment size limit — showing directories only.", ""]
              lines += ["<sub>Read with [Source2Viewer-CLI](https://github.com/ValveResourceFormat/ValveResourceFormat)</sub>", ""]
              return "\n".join(lines)


          report = render_report(include_files=True)
          if len(report) > MAX_COMMENT_CHARS:
              print(f"Full tree too large ({len(report)} characters), falling back to directories-only")
              report = render_report(include_files=False)

          with open("vpk_report.md", "w", encoding="utf-8") as f:
              f.write(report)

          print(f"Final report size: {len(report)} characters")
          print(f"Archives inspected: {len(results)}, rejected: {sum(1 for r in results if not r[1])}")
          if any(not ok for _, ok, _ in results):
              sys.exit(1)
          PY

      - name: Post or Update PR Comment
        if: ${{ always() && hashFiles('vpk_report.md') != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          COMMENT_ID=$(gh api \
            "repos/$REPO/issues/$PR_NUMBER/comments" \
            --paginate \
            --jq '.[] | select(.body | contains("<!-- vpk-inspector-report -->")) | .id' \
            | head -n 1 || true)

          if [ -n "$COMMENT_ID" ]; then
            echo "Updating existing VPK Inspector comment: $COMMENT_ID"
            jq -Rs '{body: .}' vpk_report.md |
              gh api \
                --method PATCH \
                "repos/$REPO/issues/comments/$COMMENT_ID" \
                --input -
          else
            echo "Creating new VPK Inspector comment"
            gh pr comment "$PR_NUMBER" \
              --body-file vpk_report.md
          fi
