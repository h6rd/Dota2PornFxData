name: VPK Inspector

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: vpk-inspector-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect-vpk:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'submission/')

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install vpk
        run: pip install vpk

      - name: Find and inspect VPK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p inspector-work
          ZIP_FILE=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[] | select(.status != "removed") | .filename' \
            | grep -iE '^pending/[^/]+/[^/]+\.zip$' | head -n 1 || true)
          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "No ZIP file added by this PR found in pending/"
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          export ZIP_FILE
          python <<'PY'
          import os
          import re
          import sys
          import zipfile
          import vpk

          MAX_VPK_BYTES = 100 * 1024 * 1024
          MAX_LIST_LINES = 200

          def clean(value):
              # Names come from an untrusted archive: keep them printable and unable to break out of a Markdown fence.
              return "".join(ch for ch in str(value) if ch.isprintable() and ch not in "`~")

          zip_file = os.environ["ZIP_FILE"]
          with zipfile.ZipFile(zip_file) as zf:
              file_infos = [i for i in zf.infolist() if not i.is_dir()]
              unexpected = [i.filename for i in file_infos if not i.filename.lower().endswith(".vpk")]
              if unexpected or len(file_infos) != 1:
                  listing = "\n".join(clean(i.filename) for i in file_infos[:MAX_LIST_LINES]) or "(no files)"
                  with open("vpk_report.md", "w", encoding="utf-8") as f:
                      f.write(f"""<!-- vpk-inspector-report -->
          ## VPK Inspector

          ⚠️ **Rejected: the mod archive must contain exactly one `.vpk` file and nothing else.**

          ~~~~~text
          {listing}
          ~~~~~
          """)
                  print("Archive content policy violated")
                  sys.exit(1)

              # Extract only the single .vpk, with a size cap (never trust declared sizes of an untrusted archive)
              info = file_infos[0]
              base = re.sub(r"[^A-Za-z0-9._-]", "_", os.path.basename(info.filename)) or "mod_dir.vpk"
              os.makedirs("inspector-work/extracted", exist_ok=True)
              vpk_file = os.path.join("inspector-work/extracted", base)
              written = 0
              with zf.open(info) as src, open(vpk_file, "wb") as dst:
                  while True:
                      chunk = src.read(1024 * 1024)
                      if not chunk:
                          break
                      written += len(chunk)
                      if written > MAX_VPK_BYTES:
                          print("The .vpk inside the archive is larger than the inspector limit")
                          sys.exit(1)
                      dst.write(chunk)

          print(f"Found VPK: {vpk_file}")
          archive = vpk.open(vpk_file)
          files = sorted(clean(f) for f in archive)
          extensions = {}

          for path in files:
              filename = os.path.basename(path)
              if "." in filename:
                  ext = "." + filename.rsplit(".", 1)[1].lower()
              else:
                  ext = "[no extension]"
              extensions[ext] = extensions.get(ext, 0) + 1

          MAX_COMMENT_CHARS = 55000

          def build_tree(paths, include_files):
              tree = {}
              for path in paths:
                  parts = path.replace("\\", "/").split("/")
                  if not include_files:
                      parts = parts[:-1]
                  current = tree
                  for part in parts:
                      current = current.setdefault(part, {})
              return tree

          def render_tree(node, prefix=""):
              lines = []
              items = sorted(node.items())
              for index, (name, children) in enumerate(items):
                  last = index == len(items) - 1
                  connector = "└── " if last else "├── "
                  lines.append(prefix + connector + name)
                  if children:
                      next_prefix = prefix + ("    " if last else "│   ")
                      lines.extend(render_tree(children, next_prefix))
              return lines

          extension_lines = [
              f"- `{ext}`: {count}"
              for ext, count in sorted(
                  extensions.items(),
                  key=lambda x: (-x[1], x[0])
              )
          ]
          extensions_text = "\n".join(extension_lines)

          def render_report(tree_text, note=""):
              return f"""<!-- vpk-inspector-report -->
          ## VPK Inspector

          ### Directory structure

          ```text
          {tree_text}
          ```
          {note}
          ### Extensions

          {extensions_text}

          **Total files:** {len(files)}
          """

          full_tree_text = "\n".join(render_tree(build_tree(files, include_files=True)))
          full_report = render_report(full_tree_text)

          if len(full_report) <= MAX_COMMENT_CHARS:
              report = full_report
              print(f"Full tree (with files) selected: {len(full_report)} characters")
          else:
              dirs_tree_text = "\n".join(render_tree(build_tree(files, include_files=False)))
              note = "\n> Individual files are hidden because the full tree exceeds the GitHub comment size limit — showing directories only.\n\n"
              report = render_report(dirs_tree_text, note)
              print(f"Full tree too large ({len(full_report)} characters), falling back to directories-only: {len(report)} characters")

          with open("vpk_report.md", "w", encoding="utf-8") as f:
              f.write(report)

          print(f"Final report size: {len(report)} characters")
          print(f"Total VPK files: {len(files)}")
          PY

      - name: Post or Update PR Comment
        if: ${{ always() && hashFiles('vpk_report.md') != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          COMMENT_ID=$(gh api \
            "repos/$REPO/issues/$PR_NUMBER/comments" \
            --paginate \
            --jq '.[] | select(.body | contains("<!-- vpk-inspector-report -->")) | .id' \
            | head -n 1 || true)

          if [ -n "$COMMENT_ID" ]; then
            echo "Updating existing VPK Inspector comment: $COMMENT_ID"
            jq -Rs '{body: .}' vpk_report.md |
              gh api \
                --method PATCH \
                "repos/$REPO/issues/comments/$COMMENT_ID" \
                --input -
          else
            echo "Creating new VPK Inspector comment"
            gh pr comment "$PR_NUMBER" \
              --body-file vpk_report.md
          fi