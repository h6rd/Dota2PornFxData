name: Publish approved mods to main repo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: publish-to-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Mint installation token (GitHub App)
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MAIN_REPO_APP_ID }}
          private-key: ${{ secrets.MAIN_REPO_APP_PRIVATE_KEY }}
          owner: ${{ secrets.MAIN_REPO_OWNER }}
          repositories: ${{ secrets.MAIN_REPO_NAME }},${{ github.event.repository.name }}

      - name: Checkout DATA repo
        uses: actions/checkout@v6
        with:
          path: data-repo
          fetch-depth: 1
          token: ${{ steps.app_token.outputs.token }}

      - name: Skip if nothing pending
        id: pending
        working-directory: data-repo
        run: |
          if [ -d pending ] && [ -n "$(find pending -mindepth 1 -maxdepth 1 -type d 2>/dev/null)" ]; then
            count=$(find pending -mindepth 1 -maxdepth 1 -type d | wc -l)
            echo "Found $count submission(s) waiting in pending/."
            echo "has_pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending/ is empty - nothing to do, skipping the rest of this run."
            echo "has_pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main catalog repo
        if: steps.pending.outputs.has_pending == 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.MAIN_REPO_OWNER }}/${{ secrets.MAIN_REPO_NAME }}
          token: ${{ steps.app_token.outputs.token }}
          path: main-repo
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            assets/data

      - name: Setup Node.js
        if: steps.pending.outputs.has_pending == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}

      - name: Run publish script
        if: steps.pending.outputs.has_pending == 'true'
        id: publish
        working-directory: data-repo
        env:
          DATA_DIR: .
          MAIN_REPO_DIR: ../main-repo
          ALLOWED_CATEGORIES: ${{ vars.ALLOWED_CATEGORIES }}
          ALLOWED_HEROES: ${{ vars.ALLOWED_HEROES }}
        run: node scripts/publish.js

      - name: Notify Discord (published)
        if: ${{ !cancelled() && steps.pending.outputs.has_pending == 'true' && steps.publish.outputs.published_count > 0 }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COUNT: ${{ steps.publish.outputs.published_count }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -sf -X POST -H "Content-Type: application/json" \
              -d "{\"content\":\"\ud83d\ude80 Published $COUNT approved submission(s) to the main catalog repository.\"}" \
              "$DISCORD_WEBHOOK_URL" || true
          fi

      - name: Notify Discord (failure)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -sf -X POST -H "Content-Type: application/json" \
              -d '{"content":"\u26a0\ufe0f Publish workflow failed - check the DATA repo Actions run and inspect pending/ for anything left over."}' \
              "$DISCORD_WEBHOOK_URL" || true
          fi